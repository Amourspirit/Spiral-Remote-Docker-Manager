name: ${COMPOSE_PROJECT_NAME}

services:
  arcane-manager:
    image: ghcr.io/getarcaneapp/manager:latest
    restart: always
    container_name: arcane-manager
    profiles: [ arcane ]
    ports:
      - '${ARCANE_EXTERNAL_PORT:?Set ARCANE_EXTERNAL_PORT in .env}:3552'
    environment:
      APP_URL: "https://arcane.originfield.now/"
      PUID: "${ARCANE_PUID:?Set ARCANE_PUID in .env}"
      PGID: "${ARCANE_PGID:?Set ARCANE_PGID in .env}"
      ENCRYPTION_KEY: "${ARCANE_ENCRYPTION_KEY:?Set ARCANE_ENCRYPTION_KEY in .env}"
      JWT_SECRET: "${ARCANE_JWT_SECRET:?Set ARCANE_JWT_SECRET in .env}"
      TZ: "${SERVER_TZ:-None}"
      ANALYTICS_DISABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./storage/arcane/data:/app/data
      - ./storage/arcane/builds:/builds
      - ./storage/arcane/backups:/backups
    healthcheck:
      test: ['CMD', '/app/arcane', 'health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
    - arcane-net


  arcane-route-manager:
    build:
      context: ./codebase/cloud-tier/cloudflare-route
    container_name: arcane-route-manager
    profiles: [ cf-arcane ]
    restart: always
    environment:
      API_TOKEN: ${CF_API_TOKEN:?Set CF_API_TOKEN in .env}
      RECORD_NAMES: ${CF_RECORD_NAMES:?Set CF_RECORD_NAMES in .env}
      ROUTE_DISABLE_ON_STOP: ${CF_ROUTE_DISABLE_ON_STOP:-1}
      ROUTE_ENABLE_ON_START: ${CF_ROUTE_ENABLE_ON_START:-1}
      TUNNEL_CNAME: ${CF_TUNNEL_CNAME:?Set CF_TUNNEL_CNAME in .env}
      ZONE_ID: ${CF_ZONE_ID:?Set CF_ZONE_ID in .env}
      CF_ALLOW_DELETE_MISMATCH: ${CF_ALLOW_DELETE_MISMATCH:-false}
      CF_CONNECT_TIMEOUT: ${CF_CONNECT_TIMEOUT:?Set CF_CONNECT_TIMEOUT in .env}
      CF_MAX_TIME: ${CF_MAX_TIME:-10}
      CF_RETRY_COUNT: ${CF_RETRY_COUNT:-3}
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:?Set CF_TUNNEL_ID in .env}
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env}
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      arcane-manager:
        condition: service_healthy
    networks:
      - arcane-net

networks:
  arcane-net:
    driver: bridge
name: ${COMPOSE_PROJECT_NAME}

services:
  arcane-manager:
    image: ghcr.io/getarcaneapp/manager:latest
    restart: always
    container_name: arcane-manager
    profiles: [ arcane ]
    ports:
      - '${ARCANE_EXTERNAL_PORT:?Set ARCANE_EXTERNAL_PORT in .env}:3552'
    environment:
      APP_URL: "https://arcane.originfield.now/"
      PUID: "${ARCANE_PUID:?Set ARCANE_PUID in .env}"
      PGID: "${ARCANE_PGID:?Set ARCANE_PGID in .env}"
      ENCRYPTION_KEY: "${ARCANE_ENCRYPTION_KEY:?Set ARCANE_ENCRYPTION_KEY in .env}"
      TZ: "${SERVER_TZ:-None}"
      ANALYTICS_DISABLED: "false"
    volumes:
      - ${DOCKER_SOCKS_PATH:?Set DOCKER_SOCKS_PATH in .env}:/var/run/docker.sock:ro
      - ${ARCANE_STORAGE_PATH:?Set ARCANE_STORAGE_PATH in .env}/data:/app/data
      - ${ARCANE_STORAGE_PATH:?Set ARCANE_STORAGE_PATH in .env}/builds:/builds
      - ${ARCANE_STORAGE_PATH:?Set ARCANE_STORAGE_PATH in .env}/backups:/backups
    healthcheck:
      test: ['CMD', '/app/arcane', 'health']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      cfroute.enabled: "${ARCANE_CF_ROUTE_ENABLED:?Set ARCANE_CF_ROUTE_ENABLED in .env}"
      cfroute.names: ${ARCANE_CF_ROUTE_NAMES:?Set ARCANE_CF_ROUTE_NAMES in .env}
      cfroute.proxied: "${ARCANE_CF_ROUTE_PROXIED:?Set ARCANE_CF_ROUTE_PROXIED in .env}"
      cfroute.delete_on_stop: "${ARCANE_CF_ROUTE_DELETE_ON_STOP:?Set ARCANE_CF_ROUTE_DELETE_ON_STOP in .env}"
      cfroute.zone_id: ${CF_ZONE_ID:?Set CF_ZONE_ID in .env}
      cfroute.tunnel_cname: ${CF_TUNNEL_CNAME:?Set CF_TUNNEL_CNAME in .env}
    networks:
    - arcane-net

networks:
  arcane-net:
    driver: bridge
